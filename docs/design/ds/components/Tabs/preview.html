<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--bg); }
.pv { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pv-k { min-width: 128px; color: var(--ink-3); font: 600 12px/16px var(--font-sans); }
</style>
</head>
<body class="cx">
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false"><symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"></path></symbol><symbol id="i-rune" viewBox="0 0 24 24"><path d="M12 3.5l6 8.5-6 8.5-6-8.5z"></path><path d="M12 9l2.1 3-2.1 3-2.1-3z"></path></symbol><symbol id="i-s-base" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"></path></symbol></svg>
<div class="pv" style="max-width:640px">
<div class="cx-tabs" role="tablist" aria-label="Rencontres">
 <button class="cx-tab" role="tab" aria-selected="true" aria-controls="p1" id="t1">Stormveil <span class="cx-tab-n">Limgrave</span></button>
 <button class="cx-tab" role="tab" aria-selected="false" aria-controls="p2" id="t2">Capital Outskirts <span class="cx-tab-n">Altus Plateau</span></button>
</div>
<div role="tabpanel" id="p1" aria-labelledby="t1" class="cx-row" style="gap:20px"><span><svg class="cx-i sm" aria-hidden="true"><use href="#i-heart"></use></svg> PV <b class="cx-num">4 174</b></span><span><svg class="cx-i sm" aria-hidden="true"><use href="#i-rune"></use></svg> Runes <b class="cx-num">12 000</b></span><span class="cx-badge cx-src-base" title="Base game" aria-label="Source : Base game"><svg class="cx-i" aria-hidden="true"><use href="#i-s-base"></use></svg>Base</span><span class="cx-muted">Valeurs NG</span></div>
<div role="tabpanel" id="p2" aria-labelledby="t2" class="cx-row" style="gap:20px" hidden><span><svg class="cx-i sm" aria-hidden="true"><use href="#i-heart"></use></svg> PV <b class="cx-num">8 193</b></span><span><svg class="cx-i sm" aria-hidden="true"><use href="#i-rune"></use></svg> Runes <b class="cx-num">16 800</b></span><span class="cx-badge cx-src-base" title="Base game" aria-label="Source : Base game"><svg class="cx-i" aria-hidden="true"><use href="#i-s-base"></use></svg>Base</span><span class="cx-muted">Valeurs NG</span></div>
</div>
<script>
document.querySelectorAll('[role=tab]').forEach(function (t) { t.addEventListener('click', function () { document.querySelectorAll('[role=tab]').forEach(function (o) { o.setAttribute('aria-selected', String(o === t)); document.getElementById(o.getAttribute('aria-controls')).hidden = o !== t; }); }); });
</script>
</body>
</html>
