<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ProgressThread</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
html, body { margin: 0; }
body { background: var(--bg); }
.pv { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pv-k { min-width: 128px; color: var(--ink-3); font: 600 12px/16px var(--font-sans); }
</style>
</head>
<body class="cx">
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false"></svg>
<div class="pv"><div class="cx-thread" style="max-width:900px">
<div class="cx-thread-stage is-past"><span class="cx-thread-dot"></span><span style="padding-left:18px">Début <span class="cx-thread-regions">Limgrave, Weeping Peninsula</span></span></div>
<div class="cx-thread-stage is-now" aria-current="step"><span class="cx-thread-dot"></span><span style="padding-left:18px">Milieu <span class="cx-thread-regions">Liurnia, Caelid, Altus</span></span></div>
<div class="cx-thread-stage"><span class="cx-thread-dot"></span><span style="padding-left:18px">Fin <span class="cx-thread-regions">Leyndell, Mountaintops</span></span></div>
<div class="cx-thread-stage"><span class="cx-thread-dot"></span><span style="padding-left:18px">Fin de jeu <span class="cx-thread-regions">Farum Azula</span></span></div>
<div class="cx-thread-stage"><span class="cx-thread-dot"></span><span style="padding-left:18px">DLC <span class="cx-thread-regions">Gravesite Plain → Enir-Ilim</span></span></div>
</div></div>

</body>
